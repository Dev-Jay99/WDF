# ============================================================================
# StudentHub Portal - Apache Virtual Host Configuration
# Subject: Web Development Frameworks (ITUE203)
# Practical 15: Intermediate Extension - Deploy locally with Apache Virtual Hosts
# ============================================================================
#
# INSTRUCTIONS FOR LOCAL DEPLOYMENT ON WINDOWS / XAMPP:
#
# Step 1: Add Local Domain to Windows Hosts File:
#   Open Notepad as Administrator and edit:
#   C:\Windows\System32\drivers\etc\hosts
#   Append the following line:
#   127.0.0.1    studenthub.local
#   127.0.0.1    www.studenthub.local
#
# Step 2: Enable Virtual Hosts in XAMPP Apache configuration:
#   Open: C:\xampp\apache\conf\httpd.conf
#   Ensure the following line is NOT commented (remove '#' if present):
#   Include conf/extra/httpd-vhosts.conf
#
# Step 3: Append this VirtualHost block to:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
#
# Step 4: Restart Apache from the XAMPP Control Panel.
#   Access the portal in your browser at: http://studenthub.local/
# ============================================================================

<VirtualHost *:80>
    ServerAdmin admin@charusat.edu.in
    DocumentRoot "d:/DEPSTAR SEM3/WDF/StudentHub"
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    <Directory "d:/DEPSTAR SEM3/WDF/StudentHub">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        # Set default directory index
        DirectoryIndex index.php index.html

        # Prevent directory listing for sensitive folders
        <FilesMatch "^\.(htaccess|htpasswd|env|git)">
            Require all denied
        </FilesMatch>
    </Directory>

    # Custom Error Pages
    ErrorDocument 403 /pages/login.php
    ErrorDocument 404 /index.php

    # Logging
    ErrorLog "logs/studenthub_error.log"
    CustomLog "logs/studenthub_access.log" combined
</VirtualHost>
