<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Hub Portal</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="">
        <div>
            <div >
                <a href="/index.html" class="logo">StudentHub</a>
            </div>
            <nav >
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div >
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </header>

    <main>
        <section class="login-container">
            <div class="login-card">

                <header class="card-header">
                    <h1>Login to StudentHub</h1>
                    <p>Welcome back! Enter your details to continue.</p>
                </header>

                <form action="#" method="POST" >

                    <div >
                        <label for="email">University Email</label>
                        <input type="email" id="email" name="email" 
                            placeholder="your.email@charusat.edu.in" required>
                    </div>

                    <div class="form-group password">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="input-control"
                            placeholder="********" required>
                    </div>

                    <div class="form-actions-row">
                        <div class="checkbox-group remember-me">
                            <input type="checkbox" id="remember-me" name="remember-me" class="checkbox-control">
                            <label for="remember-me">Remember me</label>
                        </div>
                        <a href="/forgot-password" class="forgot-password-link">Forgot Password?</a>
                    </div>

                    <div class="form-group submit">
                        <button type="submit" class="btn btn-primary btn-full">Login</button>
                    </div>

                </form>

                <div class="register-link-container">
                    <p>Don't have an account? <a href="/register.html">Register here</a></p>
                </div>

            </div>
        </section>
    </main>            

</body>

</html>
