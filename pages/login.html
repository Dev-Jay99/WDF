<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Hub Portal</title>
    <link rel="icon" href="./images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- ===== HEADER / NAVBAR ===== -->
    <header>
        <div class="container">
            <nav>
                <a href="../index.html" class="logo">
                     StudentHub
                </a>
                <div class="nav-actions">
                    <ul class="nav-links">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="login.html" class="btn-login active">Login</a></li>
                        <li><a href="register.html" class="btn-register">Register</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="container auth-container">
            <div class="auth-card">
                
                <div class="auth-header">
                    <h2>Login to StudentHub</h2>
                    <p>Welcome back! Enter your credentials to access your portal.</p>
                </div>

                <form id="loginForm" action="#" method="POST">
                    <div class="form-group">
                        <label for="email">University Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="student@charusat.edu.in" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="form-actions-row">
                        <label class="remember-me">
                            <input type="checkbox" id="remember-me"> Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                    <p class="text-center text-secondary small mt-3">Demo: <strong>student@charusat.edu.in</strong> | Password: <strong>12345</strong></p>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                </div>

            </div>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>

</html>
