<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Information | Student Hub Portal</title>
</head>

<body>

    <header class="site-header">
        <div class="header-container">

            <div class="brand">
                <a href="index.html" class="logo-link">
                    <img src="icons/logo.svg" alt="StudentHub Logo" aria-hidden="true">
                    <span>Student Hub Portal</span>
                </a>
            </div>

            <nav class="primary-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li class="active-item"><a href="attendance.html">Attendance</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Register</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>

        </div>
    </header>

    <main class="attendance-main">
        <div class="page-wrapper">

            <h1 class="page-title">Attendance Information</h1>

            <div class="attendance-cards-container">

                <!--  Card -->
                <article class="attendance-card">
                    <div class="subject-info">
                        <div class="subject-icon-box">
                            <img src="icons/math-symbols.svg" alt="Math" aria-hidden="true">
                        </div>
                        <div class="subject-text">
                            <h2 class="subject-title">
                                WDF
                                <img src="icons/check-circle-green.svg" alt="Good Attendance" class="status-icon">
                            </h2>
                            <p class="subject-meta">Lectures Attended: 18/20</p>
                        </div>
                    </div>

                    <div class="card-divider" aria-hidden="true"></div>

                    <div class="progress-info">
                        <span class="progress-value text-blue">90%</span>
                        <div class="progress-track">
                            <div class="progress-fill bg-blue" style="width: 90%;" role="progressbar" aria-valuenow="90"
                                aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span class="progress-status text-green">90%</span>
                    </div>
                </article>

                <!-- Physics Card -->
                <article class="attendance-card">
                    <div class="subject-info">
                        <div class="subject-icon-box">
                            <img src="icons/atom.svg" alt="Physics" aria-hidden="true">
                        </div>
                        <div class="subject-text">
                            <h2 class="subject-title">FCN</h2>
                            <p class="subject-meta">Lectures Attended: 17/20</p>
                        </div>
                    </div>

                    <div class="card-divider" aria-hidden="true"></div>

                    <div class="progress-info">
                        <span class="progress-value text-blue">85%</span>
                        <div class="progress-track">
                            <div class="progress-fill bg-blue" style="width: 85%;" role="progressbar" aria-valuenow="85"
                                aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span class="progress-status text-blue">85%</span>
                    </div>
                </article>

                <!--  Card -->
                <article class="attendance-card">
                    <div class="subject-info">
                        <div class="subject-icon-box">
                            <img src="icons/beaker.svg" alt="Chemistry" aria-hidden="true">
                        </div>
                        <div class="subject-text">
                            <h2 class="subject-title">DM</h2>
                            <p class="subject-meta">Lectures Attended: 14/20</p>
                        </div>
                    </div>

                    <div class="card-divider" aria-hidden="true"></div>

                    <div class="progress-info">
                        <span class="progress-value text-blue">70%</span>
                        <div class="progress-track">
                            <div class="progress-fill bg-blue" style="width: 70%;" role="progressbar" aria-valuenow="70"
                                aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span class="progress-status text-red">70%</span>
                    </div>
                </article>

                <!--  Card -->
                <article class="attendance-card">
                    <div class="subject-info">
                        <div class="subject-icon-box">
                            <img src="icons/leaf.svg" alt="Biology" aria-hidden="true">
                        </div>
                        <div class="subject-text">
                            <h2 class="subject-title">
                                DSA
                                <img src="icons/check-circle-green.svg" alt="Good Attendance" class="status-icon">
                            </h2>
                            <p class="subject-meta">Lectures Attended: 23/25</p>
                        </div>
                    </div>

                    <div class="card-divider" aria-hidden="true"></div>

                    <div class="progress-info">
                        <span class="progress-value text-blue">92%</span>
                        <div class="progress-track">
                            <div class="progress-fill bg-blue" style="width: 92%;" role="progressbar" aria-valuenow="92"
                                aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        <span class="progress-status text-green">92%</span>
                    </div>
                </article>

            </div>
        </div>
    </main>

</body>

</html>
