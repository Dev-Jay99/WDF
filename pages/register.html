<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Hub Portal</title>
    <link rel="icon" href="./images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
</head>

<body>

    <!--  HEADER / NAVBAR  -->
    <header>
        <div class="container">
            <nav>
                <a href="../index.html" class="logo">
                    <span></span> StudentHub
                </a>
                <div class="nav-actions">
                    <ul class="nav-links">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="login.html" class="btn-login">Login</a></li>
                        <li><a href="register.html" class="btn-register active">Register</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                    
                </div>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="container register-container">
            <div class="register-card">

                <div class="register-header">
                    <h2>Create Student Account</h2>
                    <p>Fill in your information to join the StudentHub portal.</p>
                </div>

                <form id="registerForm" action="#" method="POST">
                    <div class="form-grid">

                        <div class="form-group form-group-full">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" class="form-control"
                                placeholder="Jay Bhensdadiya" required>
                        </div>

                        <div class="form-group">
                            <label for="email">University Email</label>
                            <input type="email" id="email" name="email" class="form-control"
                                placeholder="jay@charusat.edu.in" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 9876543210"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="course">Course / Branch</label>
                            <select id="course" name="course" class="form-select" required>
                                <option value="" selected disabled>Select Course</option>
                                <option value="B.Tech CE">B.Tech Computer Engineering</option>
                                <option value="B.Tech IT">B.Tech Information Technology</option>
                                <option value="B.Tech CSE">B.Tech Computer Science & Engg</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="year">Academic Year</label>
                            <select id="year" name="year" class="form-select" required>
                                <option value="" selected disabled>Select Year</option>
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year" selected>2nd Year (3rd Sem)</option>
                                <option value="3rd Year">3rd Year</option>
                                <option value="4th Year">4th Year</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="••••••••" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                placeholder="••••••••" required>
                        </div>

                        <div class="form-group form-group-full">
                            <label class="terms-group">
                                <input type="checkbox" id="terms" required>
                                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                            </label>
                        </div>

                        <div class="form-group form-group-full">
                            <button type="submit" class="btn btn-primary btn-submit">Create Account</button>
                        </div>

                    </div>
                </form>

                <div class="register-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>

            </div>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>

</html>
