<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | StudentHub</title>
</head>

<body>

    <!-- Global Header -->
    <header class="site-header">
        <div class="container header-inner">

            <div class="logo-container">
                <a href="index.html" class="logo">
                    <img src="images/logo-icon.svg" alt="StudentHub Logo" class="logo-icon">
                    StudentHub
                </a>
            </div>

            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="login.html" class="btn btn-ghost">Login</a></li>
                    <li class="active-item"><a href="register.html" class="btn btn-primary">Register</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="main-content register-page">
        <section class="register-container">
            <div class="register-card">

                <header class="card-header">
                    <h1>Create an Account at StudentHub</h1>
                    <p>Join our university portal to manage your academic journey.</p>
                </header>

                <form action="/register" method="POST" class="register-form">

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                            <img src="icons/user.svg" alt="User Icon" class="input-icon" aria-hidden="true">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">University Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" placeholder="your.email@university.edu"
                                required>
                            <img src="icons/mail.svg" alt="Mail Icon" class="input-icon" aria-hidden="true">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-wrapper">
                            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
                            <img src="icons/phone.svg" alt="Phone Icon" class="input-icon" aria-hidden="true">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            <img src="icons/eye-off.svg" alt="Hide Password Icon" class="input-icon" aria-hidden="true">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••"
                                required>
                            <img src="icons/eye-off.svg" alt="Hide Password Icon" class="input-icon" aria-hidden="true">
                        </div>
                    </div>

                    <div class="form-actions-row">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember-me" name="remember-me">
                            <label for="remember-me">Remember me</label>
                        </div>
                    </div>

                    <div class="form-group submit">
                        <button type="submit">Create Account</button>
                    </div>

                </form>

                <div class="login-link-container">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>

            </div>
        </section>
    </main>

</body>

</html>
