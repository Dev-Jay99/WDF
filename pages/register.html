</head>

<body>

                        <li><a href="login.html" class="btn-login">Login</a></li>
                        <li><a href="register.html" class="btn-register active">Register</a></li>
                    </ul>
                    <button type="button" class="theme-toggle-btn" aria-label="Toggle light/dark theme" title="Toggle theme">
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <main id="main-content">
        <div class="container">
            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb" class="breadcrumb-nav">
                <ol class="breadcrumb-list">
                    <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Student Registration</li>
                </ol>
            </nav>

            <div class="auth-container">
                <div class="auth-card register-card">

                    <div class="auth-header">
                        <h2>Register to StudentHub</h2>
                        <p>Create your student account to access portal services and events.</p>
                    </div>

                <form id="registerForm" action="#" method="POST" novalidate>
                    <div class="form-grid">

                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" class="form-control"
                                placeholder="Jay Bhensdadiya" required>
                            <small class="error-message" id="fullNameError"></small>
                        </div>

                        <div class="form-group">
                            <label for="email">University Email</label>
                            <input type="email" id="email" name="email" class="form-control"
                                placeholder="jay@charusat.edu.in" required>
                            <small class="error-message" id="emailError"></small>
                        </div>

                        <div class="form-group">
                            <label for="phone">Mobile Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 9876543210"
                                required>
                            <small class="error-message" id="phoneError"></small>
                        </div>

                        <div class="form-group">
                            <label for="course">Course / Branch</label>
                            <select id="course" name="course" class="form-select" required>
                                <option value="" selected disabled>Select Course</option>
                                <option value="B.Tech CE">B.Tech Computer Engineering</option>
                                <option value="B.Tech IT">B.Tech Information Technology</option>
                                <option value="B.Tech CSE">B.Tech Computer Science & Engg</option>
                            </select>
                            <small class="error-message" id="courseError"></small>
                        </div>

                        <div class="form-group">
                            <label for="year">Academic Year</label>
                            <select id="year" name="year" class="form-select" required>
                                <option value="" selected disabled>Select Year</option>
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year">2nd Year (3rd Sem)</option>
                                <option value="3rd Year">3rd Year</option>
                                <option value="4th Year">4th Year</option>
                            </select>
                            <small class="error-message" id="yearError"></small>
                        </div>

                        <div class="form-group gender-group">
                            <label>Gender</label>
                            <div class="gender-options">
                                <label><input type="radio" name="gender" value="Male"> Male</label>
                                <label><input type="radio" name="gender" value="Female"> Female</label>
                                <label><input type="radio" name="gender" value="Other"> Other</label>
                            </div>
                            <small class="error-message" id="genderError"></small>
                        </div>

                        <!-- Dependent Dropdowns (Practical 6 Intermediate Extension) -->
                        <div class="form-group form-group-full location-group">
                            <label>Residential Location (Country &gt; State &gt; City)</label>
                            <div class="dependent-location-grid">
                                <div>
                                    <select id="country" name="country" class="form-select" required>
                                        <option value="" selected disabled>Select Country</option>
                                    </select>
                                </div>
                                <div>
                                    <select id="state" name="state" class="form-select" disabled required>
                                        <option value="" selected disabled>Select State / Province</option>
                                    </select>
                                </div>
                                <div>
                                    <select id="city" name="city" class="form-select" disabled required>
                                        <option value="" selected disabled>Select City</option>
                                    </select>
                                </div>
                            </div>
                            <small class="error-message" id="locationError"></small>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="••••••••" required>
                            <small class="error-message" id="passwordError"></small>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                placeholder="••••••••" required>
                            <small class="error-message" id="confirmPasswordError"></small>
                        </div>

                        <!-- HTML5 Canvas Custom CAPTCHA (Practical 5 Advanced Extension) -->
                        <div class="form-group captcha-group">
                            <label for="captchaInput">Security Verification (Canvas CAPTCHA)</label>
                            <div class="captcha-container">
                                <canvas id="captchaCanvas" width="140" height="40" aria-label="CAPTCHA image verification"></canvas>
                                <button type="button" id="refreshCaptchaBtn" class="btn-refresh-captcha" title="Regenerate CAPTCHA" aria-label="Regenerate CAPTCHA">&#x21bb;</button>
                                <input type="text" id="captchaInput" name="captchaInput" class="form-control" placeholder="Code" maxlength="4" autocomplete="off" style="text-transform: uppercase;" required>
                            </div>
                            <small class="error-message" id="captchaError"></small>
                        </div>

                        <!-- Terms & Privacy Agreement -->
                        <div class="form-group form-group-full" style="margin-top: 4px; margin-bottom: 6px;">
                            <label class="terms-group" style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.84rem;">
                                <input type="checkbox" id="terms" required style="width: 16px; height: 16px; accent-color: #2563eb;">
                                <span>I agree to the <a href="#" style="color: #3b82f6;">Terms of Service</a> &amp; <a href="#" style="color: #3b82f6;">Privacy Policy</a>.</span>
                            </label>
                            <small class="error-message" id="termsError"></small>
                        </div>

                        <!-- Full Width Submit Button -->
                        <div class="form-group form-group-full" style="margin-bottom: 0;">
                            <button type="submit" class="btn btn-primary btn-full">Register Account</button>
                        </div>

                    </div>
                </form>

                <div class="auth-footer">
                    <span>Already have an account? <a href="login.html">Login here</a></span>
                </div>

            </div>
        </div>
    </div>
</main>

    <script src="../js/script.js?v=2"></script>
</body>
