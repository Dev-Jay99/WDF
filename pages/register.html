<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Hub Portal</title>
</head>

<body>
    
    <main id="main-content">
        <section aria-labelledby="register-heading">
            <h2 id="register-heading">Student registration</h2>
            <form action="#" method="post">
                <label for="reg-name">Full name</label>
                <input type="text" id="reg-name" name="name" required>

                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" name="email" required>

                <label for="reg-mobile">Mobile number</label>
                <input type="tel" id="reg-mobile" name="mobile" required>

                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" required>

                <label for="reg-confirm-password">Confirm password</label>
                <input type="password" id="reg-confirm-password" name="confirm_password" required>

                <label for="reg-course">Course</label>
                <select id="reg-course" name="course" required>
                    <option value="">Select course</option>
                    <option value="ce">Computer Engineering</option>
                    <option value="it">Information Technology</option>
                    <option value="me">Mechanical Engineering</option>
                </select>

                <label for="reg-year">Year</label>
                <select id="reg-year" name="year" required>
                    <option value="">Select year</option>
                    <option value="1">1st</option>
                    <option value="2">2nd</option>
                    <option value="3">3rd</option>
                    <option value="4">4th</option>
                </select>

                <fieldset>
                    <legend>Gender</legend>
                    <label for="gender-male">Male</label>
                    <input type="radio" id="gender-male" name="gender" value="male">

                    <label for="gender-female">Female</label>
                    <input type="radio" id="gender-female" name="gender" value="female">

                    <label for="gender-other">Other</label>
                    <input type="radio" id="gender-other" name="gender" value="other">
                </fieldset>

                <label for="reg-terms">I accept the terms and conditions</label>
                <input type="checkbox" id="reg-terms" name="terms" required>

                <button type="submit">Register</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Student Hub Portal, B.Tech (CE)</p>
    </footer>
</body>

</html>
